[build]
  # 显式声明 base 为仓库根目录。
  # 作用：netlify.toml 的 base 会覆盖 Netlify UI 里的 Base directory 设置。
  # 背景：UI 里曾被写入本机 Windows 绝对路径（C:\Users\...\portfolio-site），
  # 构建机上不存在该路径，导致 "Base directory does not exist" 直接解析配置失败。
  base = "."
  command = "npm run build"
  publish = "dist"
  # 后台 API（见 netlify/functions/），源码目录，构建时由 Netlify 自动打包
  functions = "netlify/functions"

[build.environment]
  # GITHUB_REPO 的值是公开仓库名（wjn18/portfolio-site），README/代码里到处出现，
  # 不是秘密。不加这行，Netlify Secrets Scanning 会把它当泄漏密钥，每次构建直接失败。
  SECRETS_SCAN_OMIT_KEYS = "GITHUB_REPO"

[dev]
  # 本地 `npx netlify dev` 用。
  # 必须显式声明 targetPort：Netlify 默认等 Vite 在 5173，而本项目 vite.config.js
  # 配的是 4173，不声明就会一直 "Waiting for Vite dev server on port 5173" 然后超时。
  command = "npm run dev"
  targetPort = 4173
  port = 8888
  autoLaunch = false

# /api/* 转发到 Functions，省得前端写 .netlify/functions 这种内部路径
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# 后台是内部工具，别被搜索引擎收录
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
